<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nakharax-brand-mark">
  <title id="nakharax-brand-mark">NakharaX Sovereign Protocol Mark</title>
  
  <!-- Obsidian Matte Foundation -->
  <rect width="512" height="512" rx="112" fill="#080C14"/>
  <rect x="4" y="4" width="504" height="504" rx="108" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#core-glow)" opacity="0.18"/>
  
  <defs>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="60%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="primary-stroke" x1="140" y1="140" x2="372" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="cross-stroke" x1="368" y1="148" x2="144" y2="364" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Outer Isometric Hexagonal Mesh Lattice -->
  <path 
    d="M256 68L418 162V350L256 444L94 350V162L256 68Z" 
    stroke="#1E293B" 
    stroke-width="6" 
    stroke-linejoin="round"
  />
  <path 
    d="M256 92L398 174V338L256 420L114 338V174L256 92Z" 
    stroke="#0F172A" 
    stroke-width="2" 
    stroke-dasharray="8 8"
  />

  <!-- The Architectural N+X Cryptographic Compute Monogram -->
  <!-- Left Pillar (Verification) & Right Pillar (Settlement) connected via Diagonal (N) -->
  <path 
    d="M144 362V150L368 362V150" 
    stroke="url(#primary-stroke)" 
    stroke-width="44" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- The Intersecting Routing Vector (Completing the 'X') -->
  <path 
    d="M364 154L148 358" 
    stroke="url(#cross-stroke)" 
    stroke-width="22" 
    stroke-linecap="round" 
    opacity="0.95"
  />

  <!-- Base Consensus Anchor Line -->
  <path 
    d="M160 404H352" 
    stroke="#10B981" 
    stroke-width="16" 
    stroke-linecap="round" 
    opacity="0.85"
  />

  <!-- Precision Node Vertices (4 Anchor Beacons) -->
  <circle cx="144" cy="150" r="14" fill="#FFFFFF" stroke="#10B981" stroke-width="4"/>
  <circle cx="368" cy="150" r="14" fill="#FFFFFF" stroke="#06B6D4" stroke-width="4"/>
  <circle cx="144" cy="362" r="14" fill="#FFFFFF" stroke="#06B6D4" stroke-width="4"/>
  <circle cx="368" cy="362" r="14" fill="#FFFFFF" stroke="#10B981" stroke-width="4"/>
</svg>
