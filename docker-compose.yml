version: '3.8'

services:
  # ============================================
  # ⛓️ Core Blockchain Node (Rust)
  # ============================================
  axionax-node:
    build:
      context: ./services/core
      dockerfile: core/ops/deploy/Dockerfile
    container_name: axionax-node
    restart: unless-stopped
    ports:
      - "8545:8545"     # JSON-RPC HTTP
      - "8546:8546"     # JSON-RPC WebSocket
      - "30303:30303"   # P2P
      - "9100:9100"     # Prometheus metrics
    volumes:
      - node_data:/data
    environment:
      - RUST_LOG=info,axionax=debug
      - CHAIN_ID=1337
      - NETWORK=localnet
      - RPC_HOST=0.0.0.0
      - RPC_PORT=8545
      - WS_PORT=8546
      - P2P_PORT=30303
      - BLOCK_TIME=1
      - MAX_PEERS=50
    networks:
      - axionax-net


networks:
  axionax-net:
    driver: bridge

volumes:
  node_data:
