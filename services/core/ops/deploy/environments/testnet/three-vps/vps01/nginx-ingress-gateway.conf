# Loopback-only rate-limit gateway for VPS-01.
#
# Caddy remains the only public HTTP/S listener. It forwards RPC, API and
# faucet traffic to this Nginx instance on 127.0.0.1:8081, which trusts only
# Caddy's X-Forwarded-For header to identify the originating client.

user www-data;
worker_processes auto;
pid /run/nakharax-ingress-gateway/nginx.pid;

error_log /var/log/nakharax-ingress-gateway/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format gateway '$remote_addr $host "$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent"';
    access_log /var/log/nakharax-ingress-gateway/access.log gateway;

    # Only this local Caddy instance can supply the client IP header.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 127.0.0.1;
    real_ip_recursive off;

    # Limits are deliberately above normal interactive use while bounding
    # abusive request rates and WebSocket connection hoarding.
    limit_req_zone $binary_remote_addr zone=rpc_per_ip:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=faucet_per_ip:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;

    server {
        listen 127.0.0.1:8081;
        server_name rpc.nakharax.com;

        location /ws {
            limit_conn ws_per_ip 10;
            proxy_pass http://127.0.0.1:8546;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        location / {
            limit_req zone=rpc_per_ip burst=50 nodelay;
            proxy_pass http://127.0.0.1:8545;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 127.0.0.1:8081;
        server_name api.nakharax.com;

        location / {
            limit_req zone=api_per_ip burst=40 nodelay;
            proxy_pass http://127.0.0.1:3030;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 127.0.0.1:8081;
        server_name faucet.nakharax.com;

        location / {
            limit_req zone=faucet_per_ip burst=5 nodelay;
            proxy_pass http://127.0.0.1:3002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
