version: '3.8'

networks:
  nakhara-network:
    name: nakhara-network
    driver: bridge

volumes:
  nakhara-data:
    name: nakhara-data

services:
  # nakhara Core Node (Rust)
  core-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nakhara-core-node
    command: ["nakhara_node", "start"]
    ports:
      - "8545:8545"   # RPC
      - "30303:30303" # P2P
    volumes:
      - nakhara-data:/home/nakhara/.nakhara
      - ./config.yaml:/home/nakhara/config.yaml:ro
    networks:
      - nakhara-network
    restart: on-failure
    depends_on:
      - deai-service

  # DeAI Service (Python) - Integration Test
  deai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nakhara-deai-service
    # This command runs our bridge test script.
    command: ["python3", "-u", "/app/deai/bridge_test.py"]
    networks:
      - nakhara-network
    restart: "no"

  # Local EVM dev chain (Anvil) — optional; separate chain-id from nakhara testnet
  hardhat:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: nakhara-hardhat
    command: anvil --host 0.0.0.0 --chain-id 31337
    ports:
      - "8547:8545" # Use a different host port to avoid conflict with core-node
    networks:
      - nakhara-network
    restart: unless-stopped
