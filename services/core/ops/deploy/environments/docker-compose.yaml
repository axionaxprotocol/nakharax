version: '3.8'

networks:
  nakharax-network:
    name: nakharax-network
    driver: bridge

volumes:
  nakharax-data:
    name: nakharax-data

services:
  # nakharax Core Node (Rust)
  core-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nakharax-core-node
    command: ["nakharax_node", "start"]
    ports:
      - "8545:8545"   # RPC
      - "30303:30303" # P2P
    volumes:
      - nakharax-data:/home/nakharax/.nakharax
      - ./config.yaml:/home/nakharax/config.yaml:ro
    networks:
      - nakharax-network
    restart: on-failure
    depends_on:
      - deai-service

  # DeAI Service (Python) - Integration Test
  deai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nakharax-deai-service
    # This command runs our bridge test script.
    command: ["python3", "-u", "/app/deai/bridge_test.py"]
    networks:
      - nakharax-network
    restart: "no"

  # Local EVM dev chain (Anvil) — optional; separate chain-id from nakharax testnet
  hardhat:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: nakharax-hardhat
    command: anvil --host 0.0.0.0 --chain-id 31337
    ports:
      - "8547:8545" # Use a different host port to avoid conflict with core-node
    networks:
      - nakharax-network
    restart: unless-stopped
