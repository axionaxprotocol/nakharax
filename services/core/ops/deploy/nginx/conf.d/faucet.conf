# Faucet rate limiting zone (1 request per second per IP)
limit_req_zone $binary_remote_addr zone=faucet_limit:10m rate=1r/s;

# Faucet - faucet.nakharaxx.io + faucet-api.nakharaxx.io
server {
    listen 80;
    server_name faucet.nakharaxx.io faucet-api.nakharaxx.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name faucet.nakharaxx.io faucet-api.nakharaxx.io;

    ssl_certificate /etc/letsencrypt/live/faucet.nakharaxx.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/faucet.nakharaxx.io/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://rpc.nakharaxx.io; frame-ancestors 'none';" always;

    # CORS — allow frontend origins
    set $cors_origin "";
    if ($http_origin ~* "^https://(www\.)?nakharax\.org$") {
        set $cors_origin $http_origin;
    }
    if ($http_origin ~* "^https://(explorer|app)\.nakharax\.org$") {
        set $cors_origin $http_origin;
    }

    location / {
        proxy_pass http://faucet:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Faucet rate limiting (stricter)
        limit_req zone=faucet_limit burst=5 nodelay;
    }
}
