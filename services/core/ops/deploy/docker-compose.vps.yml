# =============================================================================
# Nakhara VPS 2 (46.250.244.4) — Supporting Services Stack
# =============================================================================
# The Validator/RPC Node runs via systemd (nakhara-node.service) on the host.
# This compose file runs ONLY the supporting services:
#   nginx (SSL reverse proxy), faucet, redis, postgres, monitoring
#
# The services connect to the host's RPC via host.docker.internal:8545
# =============================================================================

services:
  # Testnet Faucet (behind nginx — not exposed directly)
  faucet:
    image: ghcr.io/nakhara-io/nakhara-faucet:latest
    pull_policy: never
    container_name: nakhara-faucet
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3002"
    environment:
      - NODE_ENV=production
      - RPC_URL=http://host.docker.internal:8545
      - FAUCET_PRIVATE_KEY=${FAUCET_PRIVATE_KEY}
      - FAUCET_AMOUNT=100
      - RATE_LIMIT_MINUTES=1440  # 24 hours
      - PORT=3002
      - CHAIN_ID=86137
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      - redis
    networks:
      - nakhara-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database (internal only — for future explorer use)
  postgres:
    image: postgres:16-alpine
    container_name: nakhara-postgres
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      - POSTGRES_DB=explorer
      - POSTGRES_USER=explorer
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nakhara-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U explorer"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (internal only — for faucet rate limiting)
  redis:
    image: redis:7-alpine
    container_name: nakhara-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set in .env}"]
    ports:
      - "127.0.0.1:6379:6379"
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    volumes:
      - redis-data:/data
    networks:
      - nakhara-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy (SSL termination for rpc/faucet)
  nginx:
    image: nginx:alpine
    container_name: nakhara-nginx
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      faucet:
        condition: service_started
    networks:
      - nakhara-net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certbot for SSL
  certbot:
    image: certbot/certbot
    container_name: nakhara-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # Prometheus Monitoring (internal only — access via Grafana)
  prometheus:
    image: prom/prometheus:latest
    container_name: nakhara-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - nakhara-net

  # Grafana Dashboard (localhost only — SSH tunnel for admin access)
  grafana:
    image: grafana/grafana:latest
    container_name: nakhara-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - nakhara-net

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  nakhara-net:
    driver: bridge
