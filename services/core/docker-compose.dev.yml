# Nakharax Core Universe - Full Stack Development
# Runs blockchain core + web services together

services:
  # ============================================
  # 🦀 Blockchain Node (Primary)
  # ============================================
  nakharax-node:
    build:
      context: ./core
      dockerfile: ops/deploy/Dockerfile
    container_name: nakharax-node
    restart: unless-stopped
    ports:
      - "8545:8545"     # JSON-RPC HTTP
      - "8546:8546"     # JSON-RPC WebSocket
      - "30303:30303"   # P2P
      - "9100:9100"     # Prometheus metrics
    volumes:
      - node_data:/data
    environment:
      - RUST_LOG=info,nakharax=debug
      - CHAIN_ID=86137
      - NETWORK=testnet
      - RPC_HOST=0.0.0.0
      - RPC_PORT=8545
      - WS_PORT=8546
      - P2P_PORT=30303
      - BLOCK_TIME=5
      - MAX_PEERS=50
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8545", "-X", "POST", "-H", "Content-Type: application/json", "-d", "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nakharax-core

  # ============================================
  # 🦀 Second Validator Node
  # ============================================
  nakharax-validator:
    build:
      context: ./core
      dockerfile: ops/deploy/Dockerfile
    container_name: nakharax-validator
    restart: unless-stopped
    ports:
      - "8555:8545"     # JSON-RPC HTTP (different port)
      - "30304:30303"   # P2P
    volumes:
      - validator_data:/data
    environment:
      - RUST_LOG=info
      - CHAIN_ID=86137
      - NETWORK=testnet
      - BOOTNODES=enode://node@nakharax-node:30303
      - VALIDATOR_MODE=true
    depends_on:
      - nakharax-node
    networks:
      - nakharax-core

  # ============================================
  # 🗄️ PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: nakharax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nakharax
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set in .env}
      POSTGRES_DB: nakharax_testnet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nakharax -d nakharax_testnet"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nakharax-core

  # ============================================
  # 📦 Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: nakharax-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set in .env}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nakharax-core

  # ============================================
  # 🌐 Web Interface (from web-universe)
  # ============================================
  web:
    build:
      context: ./web-universe/apps/web
      dockerfile: Dockerfile
    container_name: nakharax-web
    restart: unless-stopped
    depends_on:
      - nakharax-node
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_RPC_URL=http://nakharax-node:8545
      - NEXT_PUBLIC_WS_URL=ws://nakharax-node:8546
      - NEXT_PUBLIC_CHAIN_ID=86137
      - NODE_ENV=development
    networks:
      - nakharax-core

  # ============================================
  # 🛒 Marketplace (from web-universe)
  # ============================================
  marketplace:
    build:
      context: ./web-universe/apps/marketplace
      dockerfile: Dockerfile
    container_name: nakharax-marketplace
    restart: unless-stopped
    depends_on:
      - nakharax-node
    ports:
      - "5173:5173"
    environment:
      - VITE_RPC_URL=http://nakharax-node:8545
      - VITE_CHAIN_ID=86137
    networks:
      - nakharax-core

  # ============================================
  # 💧 Faucet API (built from core/tools/faucet)
  # ============================================
  faucet:
    build:
      context: ./core
      dockerfile: ops/deploy/Dockerfile.faucet
    container_name: nakharax-faucet
    restart: unless-stopped
    depends_on:
      nakharax-node: { condition: service_healthy }
      redis: { condition: service_started }
    ports:
      - "3002:3002"
    environment:
      - RPC_URL=http://nakharax-node:8545
      - PORT=3002
      - CHAIN_ID=86137
      # Dev only: use a test key; production must set FAUCET_PRIVATE_KEY securely
      - FAUCET_PRIVATE_KEY=${FAUCET_PRIVATE_KEY:?Set in .env}
    networks:
      - nakharax-core
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================
  # 📊 Prometheus (Monitoring)
  # ============================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: nakharax-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./ops/deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - nakharax-core

  # ============================================
  # 📈 Grafana (Dashboards)
  # ============================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: nakharax-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Set in .env}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/deploy/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - nakharax-core

  # ============================================
  # 🔍 Block Explorer Backend (stub in dev; use real explorer in production)
  # ============================================
  explorer-api:
    build:
      context: ./tools/devtools
      dockerfile: Dockerfile.explorer
    container_name: nakharax-explorer-api
    restart: unless-stopped
    depends_on:
      - nakharax-node
      - postgres
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    networks:
      - nakharax-core
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  node_data:
  validator_data:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  nakharax-core:
    name: nakharax-core-network
    driver: bridge
